
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BGB Akademi | Yönetim Sistemi</title>
    
    <!-- PWA Ayarları -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#111111">
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1T6HGO_QAqUAVghAwgWTh-mtyG3d67Gup">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#E30613',
              secondary: '#1D2D4C',
            },
            borderRadius: {
              'bgb': '2rem',
            },
            spacing: {
              'safe-bottom': 'env(safe-area-inset-bottom)',
            },
            animation: {
              'highlight': 'highlight 1s cubic-bezier(0, 0, 0.2, 1)',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite'
            },
            keyframes: {
              highlight: {
                '0%': { backgroundColor: '#10b98133' },
                '100%': { backgroundColor: 'transparent' }
              }
            }
          }
        }
      }
    </script>

    <style>
        html, body { 
            height: 100%;
            height: 100dvh; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Roboto', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
        }

        #root {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        #splash-loader {
            position: fixed; inset: 0; background: #111;
            display: flex; align-items: center; justify-content: center;
            z-index: 10000; transition: opacity 0.5s;
        }

        input, select, textarea {
            font-size: 16px !important;
            -webkit-user-select: text;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root">
        <div id="splash-loader">
            <div style="text-align:center;">
               <img src="https://lh3.googleusercontent.com/d/1T6HGO_QAqUAVghAwgWTh-mtyG3d67Gup" width="80" height="80" alt="BGB" style="animation: pulse 2s infinite;">
               <p style="color:#666; font-size:10px; font-weight:900; letter-spacing:4px; margin-top:20px; font-family:sans-serif; text-transform: uppercase;">BGB Akademi Yükleniyor</p>
            </div>
        </div>
    </div>
    
    <script>
      window.onload = () => {
        setTimeout(() => {
           const l = document.getElementById('splash-loader');
           if(l) { 
             l.style.opacity = '0'; 
             setTimeout(() => l.remove(), 500); 
           }
        }, 800);
      };
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
