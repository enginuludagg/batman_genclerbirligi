<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BGB Akademi</title>
    
    <!-- Tarayıcıyı taze tut -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1T6HGO_QAqUAVghAwgWTh-mtyG3d67Gup">

    <!-- Tailwind CSS (Güvenli CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { primary: '#E30613', secondary: '#1D2D4C' },
            borderRadius: { 'bgb': '2rem' }
          }
        }
      }
    </script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #111; font-family: sans-serif; overflow: hidden; }
        #splash-loader {
            position: fixed; inset: 0; background: #111;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 10000;
        }
        .diagnostic-card {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            z-index: 20000; padding: 20px; display: none; align-items: center; justify-content: center;
        }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.9); opacity: 0.7; } }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- Splash Screen -->
    <div id="splash-loader">
        <img src="https://lh3.googleusercontent.com/d/1T6HGO_QAqUAVghAwgWTh-mtyG3d67Gup" width="80" class="pulse">
        <div class="mt-8 text-center">
            <p style="color:white; font-size:10px; font-weight:900; letter-spacing:4px;">BGB AKADEMİ</p>
            <p id="status-text" style="color:#E30613; font-size:8px; font-weight:bold; margin-top:5px;">SİSTEM BAĞLANTISI KURULUYOR...</p>
        </div>
    </div>

    <!-- Hata Tanılama Ekranı (Sadece bağlantı koptuğunda görünür) -->
    <div id="diag-screen" class="diagnostic-card">
        <div class="bg-zinc-900 border border-red-600/30 p-8 rounded-[2.5rem] max-w-sm w-full text-center space-y-6">
            <div class="w-16 h-16 bg-red-600/10 rounded-2xl flex items-center justify-center mx-auto text-red-600">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <h2 style="color:white; font-size:18px; font-weight:900;">BAĞLANTI KISITLANDI</h2>
            <p style="color:#888; font-size:11px; line-height:1.6;">Operatörünüz (Turkcell/Vodafone) güvenli internet filtresi nedeniyle erişimi kısıtlıyor olabilir.</p>
            <div class="space-y-2">
                <button onclick="window.location.reload()" style="width:100%; padding:15px; background:#E30613; color:white; border-radius:15px; font-weight:900; font-size:12px; border:none;">TEKRAR DENE</button>
                <button onclick="alert('Lütfen Wi-Fi üzerinden girmeyi deneyin veya hattınızdan GÜVENLİ İNTERNETİ kapatın.')" style="width:100%; padding:15px; background:transparent; color:#555; border-radius:15px; font-weight:900; font-size:10px; border:1px solid #333;">YARDIM AL</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Önceki kalıntıları temizle (Güvenli Mod)
        window.addEventListener('load', () => {
            if ('serviceWorker' in navigator) {
                try {
                    // Güvenli temizleme
                    navigator.serviceWorker.getRegistrations()
                        .then(regs => {
                            for(let r of regs) r.unregister();
                        })
                        .catch(err => { 
                            // Hata oluşursa sessizce geç, uygulamayı durdurma
                            // console.debug('SW clear skipped:', err); 
                        });
                } catch (e) {
                    console.debug('SW Access denied or invalid state');
                }
            }

            // Splash kaldır
            setTimeout(() => {
                const splash = document.getElementById('splash-loader');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.remove(), 500);
                }
            }, 2500);
            checkConnection();
        });

        // 2. Bağlantı Kontrolü (Heartbeat)
        const checkConnection = () => {
            fetch('https://www.google.com/favicon.ico', { mode: 'no-cors' })
                .catch(() => {
                    document.getElementById('diag-screen').style.display = 'flex';
                });
        };

        // 3. Sertifika/SSL Hatası Yakalama
        window.addEventListener('error', (e) => {
            if (e && e.message && (e.message.includes('SSL') || e.message.includes('Sertifika') || e.message.includes('Failed to fetch'))) {
                document.getElementById('diag-screen').style.display = 'flex';
            }
        }, true);
    </script>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
